[package]
name = "m1-cellbuffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CellBuffer + DiffRenderer — thin pedagogical wrapper over aprender-present-terminal"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cellbuffer-demo"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
presentar-terminal = { package = "aprender-present-terminal", version = "0.33" }
presentar-core = { package = "aprender-present-core", version = "0.33" }

[dev-dependencies]
proptest = "1"
presentar-test = { package = "aprender-present-test", version = "0.31" }
m4-tests = { path = "../m4-tests" }

[lints]
workspace = true
